name: deep-rag

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: *restart-policy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deep_rag}
      POSTGRES_USER: ${POSTGRES_USER:-deep_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting services}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/001-enable-extensions.sql:/docker-entrypoint-initdb.d/001-enable-extensions.sql:ro
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    <<: *restart-policy
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    profiles: ["application"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *restart-policy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  celery-worker:
    profiles: ["application"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *restart-policy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    volumes:
      - uploads_data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "--app", "app.infrastructure.celery_app:celery_app", "worker", "--loglevel=INFO"]

  frontend:
    profiles: ["application"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    <<: *restart-policy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]

volumes:
  postgres_data:
  redis_data:
  uploads_data:
